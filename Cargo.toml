[workspace]
resolver = "2"
members = ["crates/jc-core", "crates/context-gateway", "crates/jcctl", "crates/agent-proxy", "crates/functions"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
repository = "https://github.com/marek-mraz-jc/joinedcontext-platform"

[workspace.dependencies]
# pinned per crate when the first code lands; see docs_new/Architecture/14-components.md

# ponytail: line tables only, no full debuginfo — several agents compile on one machine
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 1
debug = false
