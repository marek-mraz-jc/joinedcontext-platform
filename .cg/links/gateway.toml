# context-gateway routes: each surface module's routes() (merged by app.rs router(), T-4472) registers `.route("/path", any(handler))` (one line, or
# broken by rustfmt to a `)` alone on its line). -> provides "ANY /api/endpoint/{}/ngsi-ld/v1/{}"
# on handler `ngsi_ld`; an `ANY …/{}` key is a catch-all, which dev/trace-request.py matches by prefix.
[[link]]
name = "gateway-routes"
channel = "http"
role = "provides"
files = [
  "crates/context-gateway/src/app.rs",
  "crates/context-gateway/src/handlers/catalog.rs",
  "crates/context-gateway/src/handlers/files.rs",
  "crates/context-gateway/src/handlers/mappings.rs",
  "crates/context-gateway/src/handlers/ngsi_ld.rs",
  "crates/context-gateway/src/handlers/ogc.rs",
  "crates/context-gateway/src/handlers/openapi_doc.rs",
  "crates/context-gateway/src/handlers/schema_routes.rs",
  "crates/context-gateway/src/handlers/space_routes.rs",
  "crates/context-gateway/src/handlers/view_access.rs",
  "crates/context-gateway/src/handlers/ws.rs",
  "crates/context-gateway/src/mcp/mod.rs",
]
pattern = '(?s)\.route\(\s*"(?P<key>/[^"]+)"\s*,(?P<body>[^\n]*\)|.*?\n[ \t]*\))[ \t]*,?[ \t]*\r?\n'
each = '(?P<verb>get|post|put|patch|delete|head|options|any)\(\s*(?P<symbol>[\w:]+)'
key = "{verb} {key}"

# The gateway's hops to the broker build their paths at run time
# (`format!("/x/views/{view}/ngsi-ld/v1{path}")`, `format!("/ngsi-ld/v1{path}?…")`), so each hop
# the five traced operations take is pinned on the function that sends it, with the key Antares'
# own .cg/links/axum.toml provides (T-3917). The view hop keeps its `/x/views/{}` root; Antares
# serves it with one catch-all (antares_views::Views::router) and runs it in-process as the root key.

# The broker's view (plan 5.1, T-3643): every operation a view serves.
[[endpoint]]
channel = "http"
role = "uses"
key = "POST /x/views/{view}/ngsi-ld/v1/entities"
symbol = "context_gateway::app::serve_ngsi_ld_view"

[[endpoint]]
channel = "http"
role = "uses"
key = "PATCH /x/views/{view}/ngsi-ld/v1/entities/{id}/attrs"
symbol = "context_gateway::app::serve_ngsi_ld_view"

[[endpoint]]
channel = "http"
role = "uses"
key = "PATCH /x/views/{view}/ngsi-ld/v1/entities/{id}/attrs/{attr}"
symbol = "context_gateway::app::serve_ngsi_ld_view"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /x/views/{view}/ngsi-ld/v1/entities"
symbol = "context_gateway::app::serve_ngsi_ld_view"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /x/views/{view}/ngsi-ld/v1/temporal/entities"
symbol = "context_gateway::app::serve_ngsi_ld_view"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /x/views/{view}/ngsi-ld/v1/temporal/entities/{id}"
symbol = "context_gateway::app::serve_ngsi_ld_view"

# The gateway's own decision (no view yet: a subscription, an If-Match write, a view of another
# model, a caller under an agreement): the broker's root, the tenant pinned.
[[endpoint]]
channel = "http"
role = "uses"
key = "POST /ngsi-ld/v1/entities"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "PATCH /ngsi-ld/v1/entities/{id}/attrs"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "PATCH /ngsi-ld/v1/entities/{id}/attrs/{attr}"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /ngsi-ld/v1/entities"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "POST /ngsi-ld/v1/subscriptions"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /ngsi-ld/v1/temporal/entities"
symbol = "context_gateway::app::serve_ngsi_ld"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /ngsi-ld/v1/temporal/entities/{id}"
symbol = "context_gateway::app::serve_ngsi_ld"

# Notification egress (map 7.3): a delivery is decided again against the stored subscription and
# the entity read back under the subscriber (T-0931).
[[endpoint]]
channel = "http"
role = "uses"
key = "GET /ngsi-ld/v1/subscriptions/{id}"
symbol = "context_gateway::egress::notifications::read"

[[endpoint]]
channel = "http"
role = "uses"
key = "GET /ngsi-ld/v1/entities"
symbol = "context_gateway::egress::notifications::dispatch"
