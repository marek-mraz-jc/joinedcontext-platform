[package]
name = "jc-manifest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The manifest repository: loading, assembly, validation and model schemas, shared by jcctl and the servers (T-4604)"

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonschema = { version = "0.54", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
# The Portal renders `model_schema`'s problems and attributes into its OpenAPI document.
utoipa = { version = "5", optional = true }

[dev-dependencies]
# archive_read_bento_tests writes a zip archive field by field (T-4752).
crc32fast = "1"
flate2 = "1"
