[package]
name = "context-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0", features = ["auth", "axum", "logs"] }
jc-dcat = { path = "../jc-dcat", version = "0.1.0", features = ["dcat-ap-sk", "dcat-ap-cz"] }
jc-manifest = { path = "../jc-manifest", version = "0.1.0" }
arc-swap = "1"
# base64url for the egress subject; already in the tree via jsonwebtoken
base64 = "0.22"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
# The Endpoint's WebSocket (EP-106) is relayed to the broker view's own: the client half of the
# tungstenite axum's `ws` already links, and the stream split of the futures it already uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
regex = "1"
# The broker's own q/scopeQ evaluator, so a grant's condition is judged per entity exactly as the
# broker judges it (T-3530, EP-16); the NGSI-LD crates' release repository at a tag (T-3913).
antares-ql = { package = "ngsild-ql", git = "https://github.com/marek-mraz-jc/ngsild", tag = "v0.3.0", version = "0.3" }
antares-jsonld = { package = "ngsild-jsonld", git = "https://github.com/marek-mraz-jc/ngsild", tag = "v0.3.0", version = "0.3" }
# The broker's own subscription predicates against one in-memory entity, so the WebSocket fan-out
# (ADR-N-049) decides a client filter exactly as the broker would.
antares-matcher = { package = "ngsild-matcher", git = "https://github.com/marek-mraz-jc/ngsild", tag = "v0.3.0", version = "0.3" }
# The preview list from the Portal (Architecture/06 §7.2).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
jsonwebtoken = "9"
# sha256 for the schema surface's strong ETags; jsonwebtoken already links it
ring = "0.17"

jsonschema = { version = "0.54", default-features = false }

# The gateway's own Prometheus surface (OPS-16, TS-22). The facade is what the modules speak
# and the exporter exists only in `telemetry`; no default features, because the exporter's own
# HTTP listener and push gateway would be a second server on a second port when the surface
# already has one.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# A notification is delivered to a subscriber outside the cluster, so the outbound client
# speaks TLS (R46). `ring` rather than the default aws-lc-rs: the crate already links ring for
# the schema surface's ETags, and this adds no second C toolchain to the image build. The
# public roots are read from the image at start-up (`/etc/ssl/certs/ca-certificates.crt`, which
# the distroless base ships), so a withdrawn root arrives with the next base image rather than
# with a crate release. `rustls-pki-types` is here for its PEM reader and comes with rustls
# anyway.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = "1"
# a published Mapping's specification is served as YAML (EP-53); jc-manifest's loader links it already
serde_norway = "0.9"

[dev-dependencies]
# `bench_org` writes the synthetic organization the store tests and scale_bench load.
jcctl = { path = "../jcctl", version = "0.1.0" }
# `oneshot`, so the tenancy middleware is tested through a real tower stack.
tower = { version = "0.5", features = ["util"] }
# `test-util` pauses the clock, so the reaper's five-second bound is measured
# without a test that actually sleeps for five seconds.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
# The TLS sink of the egress tests: a certificate minted per run, because a test key in the
# repository is a finding for the secret scanner and an expiry date waiting to happen.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["http1", "server"] }
# The hub's audit line is read back as it is written (ADR-N-025 section 3); already in the
# graph through jc-core's `logs` feature.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
