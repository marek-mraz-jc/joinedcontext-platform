[package]
name = "jcctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0" }
aes-gcm = "0.10"
age = { version = "0.12", default-features = false, features = ["armor"] }
base64 = "0.22"
# The export index stamps when it was taken; jc-core already carries the same clock.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonschema = { version = "0.54", default-features = false }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
# The CKAN Action API and the gateway's DCAT record are reached over TLS, which the crate's
# own plaintext client (`model::http`) does not speak. `ring`, as the gateway's TLS stack
# already links it, and the platform's root store rather than a bundled one: a withdrawn
# root then leaves with the next base image, not with a crate release.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# Escaping a domain into an `idPattern` the same way jc-core's `Urn::id_pattern_prefix` does.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
zeroize = "1"

[dev-dependencies]
aes-gcm = "0.10"
age = { version = "0.12", features = ["armor"] }
base64 = "0.22"
sha2 = "0.10"
