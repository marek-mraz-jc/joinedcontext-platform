[package]
name = "token-sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The pipeline runner's token sidecar: one federated token per pipeline (PL-19)"

[[bin]]
name = "jc-token-sidecar"
path = "src/main.rs"

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0", features = ["logs"] }
axum = { version = "0.8", features = ["form"] }
base64 = "0.22"
# Native roots plus the cluster CA from the pod's own mount: the Kubernetes API is signed by
# the cluster CA, Keycloak by whatever the node trusts.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
