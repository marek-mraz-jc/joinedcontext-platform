# The scale bench (T-4443, CC-54): a generated organization of 100, 1,000 and 10,000 Endpoints,
# measured offline (store load, reaper ticks, slug lookup, jcctl validate, peak RSS). On demand
# only; never a gate. Each size runs three times in a process of its own.
name: scale-bench

on:
  workflow_dispatch:
    inputs:
      sizes: { description: "Endpoint counts, space-separated", default: "100 1000 10000" }

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p context-gateway --example scale_bench
      - env: { SIZES: "${{ inputs.sizes }}" }
        run: |
          for n in $SIZES; do
            for run in 1 2 3; do target/release/examples/scale_bench "$n"; done
          done | tee -a "$GITHUB_STEP_SUMMARY"
