# The WebSocket fan-out rig (T-4133, ADR-N-049 §2.9, EP-115): N clients with random filters on one
# Endpoint, every notification checked against antares-matcher's ground truth, latency, memory
# and CPU measured. On a runner of its own, never dev and never a shared host. On demand, and on a
# push that changes the rig or the fan-out, so a change to either is proven before it is merged.
name: ws-fanout-rig

on:
  workflow_dispatch:
    inputs:
      changes: { description: "Changes in the stream", default: "2000" }
  push:
    branches: ["agent/**"]
    paths:
      - "crates/context-gateway/src/fanout.rs"
      - "crates/context-gateway/src/fanout/**"
      - "crates/context-gateway/tests/ws_fanout_rig.rs"
      - ".github/workflows/ws-fanout-rig.yml"

permissions:
  contents: read

concurrency:
  group: ws-fanout-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sockets: [100, 1000, 5000]
        # dev's Helsinki transit stream writes about 20 changes a second; 200 is the stress run.
        rate: [20, 200]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # 5 000 clients and their 5 000 accepted sockets need more descriptors than the default.
      - run: ulimit -n 65536 && cargo test --release --locked -p context-gateway --test ws_fanout_rig -- --nocapture
        env:
          RIG_SOCKETS: ${{ matrix.sockets }}
          RIG_CHANGES: ${{ inputs.changes || '2000' }}
          RIG_RATE: ${{ matrix.rate }}
          RIG_REPORT: ${{ runner.temp }}/ws-fanout-${{ matrix.sockets }}-${{ matrix.rate }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ws-fanout-${{ matrix.sockets }}-${{ matrix.rate }}
          path: ${{ runner.temp }}/ws-fanout-${{ matrix.sockets }}-${{ matrix.rate }}.json
          if-no-files-found: ignore
          retention-days: 30
