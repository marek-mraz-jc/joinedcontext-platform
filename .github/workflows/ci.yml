name: ci
on:
  pull_request:
  push:
    # A batch branch runs the fast gate on its own head, which tasks/automerge reads before it
    # merges a low-risk reviewed branch (T-4675). Public repository: the minutes are free.
    # preview/** asks for a branch preview: preview.yml builds its images after this run (T-5547).
    branches: [main, "agent/**", "preview/**"]
permissions: { contents: read }
# On main a run is never cancelled: merges land minutes apart, and each one used to cancel the
# run before it, so main went without a finished run. Main runs are keyed by commit (T-4696, as the
# Portal's T-5022): with one group GitHub replaced the pending run, and the commit image.yml built
# that hour could be left without the ci verdict pin-images waits for; the path filter keeps a run
# per commit cheap. Branches keep one group per ref and cancel the older run.
concurrency:
  group: "ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"
jobs:
  # Which jobs the change needs (T-4696, as the Portal's T-4985): the paths changed since the base,
  # mapped by scripts/ci/changes.sh. On main the base is the newest commit whose ci run on main
  # was green, so a range a cancelled or red run left unchecked runs again; on a branch it is the
  # fork from main (a pull request: from its base). gitleaks runs on every push without asking,
  # and a skipped job counts as success in the run's conclusion.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, actions: read }
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      model-tools: ${{ steps.paths.outputs.model-tools }}
      pipelines: ${{ steps.paths.outputs.pipelines }}
      widget: ${{ steps.paths.outputs.widget }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the path filter self-test
        run: sh scripts/ci/changes.sh --selftest
      - id: paths
        name: the jobs this change needs
        env:
          BASE_REF: "${{ github.base_ref || 'main' }}"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base=""
          # The checkout holds one commit: fetch the base, or deepen to find the fork; no base found
          # runs everything.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$green" ] && git fetch -q --depth=1 origin "$green"; then base=$green; fi
          elif git fetch -q --deepen=100 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            base=$(git merge-base HEAD "origin/$BASE_REF" || true)
          fi
          echo "base: ${base:-none}"
          sh scripts/ci/changes.sh "$base" | tee -a "$GITHUB_OUTPUT"
  # Supersede (T-5659): with the account's job slots full, every merge queued one more main run and
  # none finished (9 portal runs queued 10:08-11:55Z on 2026-10-25). tasks/ci closes a task once a
  # later green main run contains its commit, so this run cancels the older main runs it contains
  # whose jobs are only queued; scripts/ci/supersede.py says which. Its own job, because only
  # here does a token get actions: write, and only on a push to main.
  supersede:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: scripts/ci }
      - name: the selection self-test
        run: python3 scripts/ci/supersede.py --selftest
      - name: cancel the older main runs this run contains
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/ci/supersede.py
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # A warm cache runs this in 2-3 min. A cold one (the repo's 10 GB cache evicts the job's key)
    # needs ~12; a run cut off at the timeout never saves its cache, so 8 min turned one eviction
    # into a red on every push (36193fa, d1b8f7f; T-4146).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: every action is a commit, and only a publishing job may publish (T-0851)
        run: python3 scripts/ci/check-workflow-pins.py
      - name: image.yml's hourly gate waits out the hour after the newest image (T-5449)
        run: python3 scripts/ci/image-gate.py --selftest
      - name: a branch preview's tag is pv-<DNS-1123 slug of at most 40>-<sha12>, its GC takes only old pv- images (T-5547)
        run: sh scripts/ci/preview-tag.sh --selftest && python3 scripts/ci/preview-gc.py --selftest
      # Every workspace member is in the image's dependency layer (T-3366: crates/app-sdk was not,
      # and the image build failed on main while this lane stayed green).
      - name: the Dockerfile copies every workspace member
        run: python3 scripts/ci/check-dockerfile-members.py
      # Crate edges follow the layers of docs Architecture/14-components.md section 4 (T-4770).
      - name: every crate edge follows the layers
        run: python3 scripts/ci/check-crate-layers.py --selftest && python3 scripts/ci/check-crate-layers.py
      # A file a crate embeds (include_str!) that .dockerignore keeps out compiles here and
      # fails only in the image build (T-4267: mcp/primer.md under **/*.md).
      - name: every file a crate embeds reaches the image build
        run: python3 scripts/ci/check-dockerignore-includes.py
      # No format code comes back into the gateway: ci/gateway-formats-baseline.txt only shrinks
      # (ADR-N-051, T-4476).
      - name: the gateway holds no new format code
        run: python3 scripts/ci/check-gateway-formats.py --selftest && python3 scripts/ci/check-gateway-formats.py
      # The checker itself; the statements run on a full `cg build --fg` before every merge, since
      # cg is not on the runner (T-3682, as Antares T-3587).
      - name: cg security invariants self-test
        run: python3 dev/cg-invariants.py --selftest
      # Code no entry point reaches, per crate, against ci/cg-dead-code-baseline.txt (T-3918).
      - name: cg dead-code ratchet self-test
        run: python3 dev/cg-dead-code.py --selftest
      # Complexity, untested public functions and crate edges, against ci/cg-structure-baseline.txt (T-4587).
      - name: cg structure ratchet self-test
        run: python3 dev/cg-structure.py --selftest
      # HTTP links across the platform, Portal and Antares graphs, and the security, modularity and
      # memory counts, against ci/cg-audit-baseline.txt (T-4594).
      - name: cg audit self-test
        run: python3 dev/cg-audit.py --selftest
      - name: request trace self-test (T-3917)
        run: python3 dev/trace-request.py --selftest
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # The PDFium the assistant crate links, pinned and checked; kreuzberg's build would
      # otherwise fetch the newest release unchecked (T-3052).
      - run: sh scripts/ci/pdfium.sh "$RUNNER_TEMP/pdfium" && echo "KREUZBERG_PDFIUM_PREBUILT=$RUNNER_TEMP/pdfium" >> "$GITHUB_ENV"
      # --locked: a dependency added without its lock entry fails here, in the fast lane, and
      # not first in the image build (T-0616).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The assistant is built and tested on its own: kreuzberg depends on serde_toon_format,
      # which turns on serde_json's `preserve_order`, and in one invocation that feature reaches
      # every crate, changing the order of every JSON object the gateway and jcctl write
      # (schemas, blueprints, CKAN columns; T-3206).
      - run: cargo test --workspace --exclude assistant --lib --bins --locked
      - run: cargo test -p assistant --lib --bins --locked
      # The rustdoc of a jc-core field is the JSON Schema `description` the Portal ships, the
      # OpenAPI document publishes and every MCP tool list hands a model, so a broken
      # intra-doc link is a broken sentence in four places (T-2145, UI-02). The whole workspace,
      # not jc-core alone: a link to a private item fails only here, and clippy does not run
      # rustdoc lints (T-4758, T-4780 and tenancy.rs's AUDIT each held main red until the next
      # ci-full; T-5312). --no-deps after clippy and the tests: ~20 s warm.
      - run: cargo doc --workspace --no-deps --locked
        env: { RUSTDOCFLAGS: "-D warnings" }
      # jc-core's integration tests, one binary (T-5512): `--lib --bins` above runs none of them,
      # and a stale committed schema went red only in the nightly ci-full (T-5379). Among them the
      # contract the descriptions make: every field has one, and none of them is a credential
      # (kind_documentation_tests, T-2145); every environment variable a service reads is
      # explained where it is read, and no secret is read into a log line
      # (configuration_documentation_tests, T-2140, OPS-27; the configuration reference in the
      # docs is generated from those sentences); and policy_odrl_tests writes the ODRL records
      # validate-odrl-profile.py reads below.
      - run: cargo test -p jc-core --test it --locked
        env: { ODRL_RECORDS_DIR: "${{ runner.temp }}/odrl-records" }
      # The gateway library builds no jemalloc for its dependents (the Portal); only the image's
      # `--features context-gateway/jemalloc` links it (T-5017).
      - run: |
          tree="$(cargo tree -p context-gateway -e normal --prefix none --locked)"
          if grep -q '^tikv-jemalloc' <<<"$tree"; then echo "context-gateway's default features pull jemalloc" >&2; exit 1; fi
      # Every variant of an Endpoint's DCAT-AP record against the SEMIC DCAT-AP 3.0 shapes pinned
      # in the repository, and its JSON-LD and Turtle as one graph (T-2789, EP-78). The test
      # writes the records, pyshacl reads them: one test binary and a pip install, under a minute.
      - run: cargo test -p context-gateway --test dcat_ap_catalog_tests --locked
        env: { DCAT_RECORDS_DIR: "${{ runner.temp }}/dcat-records" }
      # The MCP tools/list byte ceiling, which only comes down: a longer tool description went
      # red only in the nightly ci-full, after the merge (T-5148, T-5576).
      - run: cargo test -p context-gateway --test mcp_hub_names_tests --locked
      # jcctl's Portal routes against the Portal OpenAPI vendored in crates/jcctl/portal-api.json
      # (T-5966): a route, method, query parameter or kind the two disagree on fails here.
      - run: cargo test -p jcctl --test it --locked portal_api_drift_tests::
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install --quiet --disable-pip-version-check pyshacl==0.30.1
      - run: python3 scripts/ci/validate-dcat-ap.py "${{ runner.temp }}/dcat-records"
      # The ngsi-ld: ODRL profile's SHACL shapes and `jcctl policy import` refuse the same
      # documents (T-5039, ADR-N-057 decision 4): policy_odrl_tests in the jc-core step above
      # writes them, pyshacl reads them.
      - run: python3 scripts/ci/validate-odrl-profile.py "${{ runner.temp }}/odrl-records"
  model-tools:
    needs: changes
    if: needs.changes.outputs.model-tools == 'true'
    # The one non-Rust component (Architecture/11 §6.5). It runs beside the Rust job rather
    # than after it, so the fast lane stays as long as its slowest job and no longer.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: tools/model-tools } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: "pip", cache-dependency-path: tools/model-tools/pyproject.toml }
      - run: pip install .[test]
      # SDK-10: `test_gen_typescript` compiles jc-types.ts with the TypeScript the SDK pins.
      - run: npm install -g typescript@5.9.3
      # DM-39's golden tests run the compiled Bloblang through the Bento the cluster runs, by
      # digest. Pulling it here rather than inside the first test that needs it turns a
      # registry outage into a step that says so.
      - run: docker pull ghcr.io/warpstreamlabs/bento@sha256:656c55de3f8deddd4ee743f3c76f3b497e67324e940f2bc1769693cd8b906364
      - run: pytest -q
      # DM-02: a committed artifact must equal what this generator renders now, or the schema a
      # partner reads is not the schema the source says. The check lives in this job because
      # the Model Tools it needs is already installed here, and it runs `jcctl model diff` —
      # the same code path the Portal preview and an agent use, which is the point of DM-32.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Every DataModel's artifacts are the ones this generator renders
        working-directory: ${{ github.workspace }}
        env:
          MODEL_TOOLS_MODELS: tools/model-tools/models
        run: |
          python3 -m service --host 127.0.0.1 --port 8080 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          # Exit 2 means a committed artifact is stale: regenerate with `jcctl model generate`
          # and commit the result beside the source (DM-01, DM-02).
          cargo run -q -p jcctl -- model diff --repo-dir examples/datamodels --url http://127.0.0.1:8080
      # T-5066: the generated valid and invalid datasets of each fixture and committed model, held
      # to its SHACL shapes and JSON Schema (gen_datasets exits 1 on a record they disagree on) and
      # then to the ModelSchema the gateway checks a write with: valid passes, invalid fails at its slot.
      - name: SHACL, the JSON Schema and the write path agree on every generated record
        working-directory: ${{ github.workspace }}
        env:
          MODEL_TOOLS_MODELS: tools/model-tools/models
          MODEL_DATASETS_DIR: ${{ runner.temp }}/model-datasets
        run: |
          mapfile -t committed < <(find examples/datamodels -name '*.linkml.yaml')
          python3 tools/model-tools/src/gen_datasets.py -o "$MODEL_DATASETS_DIR" \
            tools/model-tools/tests/fixtures/senzor.linkml.yaml tools/model-tools/tests/fixtures/constraints.linkml.yaml \
            "${committed[@]}"
          cargo test -p jc-manifest --test model_datasets_tests --locked
  pipelines:
    needs: changes
    if: needs.changes.outputs.pipelines == 'true'
    # PL-21, PL-22: the shipped ingestion examples are linted and run against their golden fixtures.
    # Bento is pinned by version and verified by checksum, the way an image is pinned by digest.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENTO_VERSION: "1.21.1"
      BENTO_SHA256: "bde76909dfba1173a0338886f747b4a4647c316d9627c1c0472d8a1cc1eda453"
      # `bento lint` refuses a config whose environment interpolations are unset; the runner
      # gets the real token from its ServiceAccount, CI only needs the name to resolve.
      SERVICE_ACCOUNT_TOKEN: "lint-placeholder"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bento
        run: |
          curl -sSLo bento.tar.gz "https://github.com/warpstreamlabs/bento/releases/download/v${BENTO_VERSION}/bento_${BENTO_VERSION}_linux_amd64.tar.gz"
          echo "${BENTO_SHA256}  bento.tar.gz" | sha256sum --check --status
          tar xzf bento.tar.gz bento
          sudo install -m 0755 bento /usr/local/bin/bento
      # Only the Bento configs: the folders also hold platform manifests, which are a
      # different schema and are checked by `cargo test -p jcctl`.
      - run: bento lint ./examples/ingestion/*/bento.yaml ./examples/ingestion/gtfs-rt/tests/decoder.yaml
      - run: bento test ./examples/ingestion/...
  widget:
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    # T-3325: the assistant widget's answer renderer, with the runner's own Node: no install,
    # no dependency, the built-in test runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node --test crates/assistant/widget/render.test.js crates/assistant/widget/app/app.test.mjs
  widget-layout:
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    # T-4283: the widget in Chromium at 1280, 768 and 375 px against a stand-in server: one
    # scroll area, header and composer whole, the panel fitted to its content, the language asked
    # once. The browser image is pinned by digest; the test runner is the image's version.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    defaults: { run: { working-directory: crates/assistant/widget } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.1
      - run: npx playwright test -c layout.config.mjs --output "$RUNNER_TEMP/layout"
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
