name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
# On main a run is never cancelled: merges land minutes apart, and each one used to cancel the
# run before it, so main went without a finished run. One run finishes, the newest push waits
# behind it (GitHub keeps one pending run per group). Branches still cancel.
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}" }
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: every action is a commit, and only a publishing job may publish (T-0851)
        run: python3 scripts/ci/check-workflow-pins.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # --locked: a dependency added without its lock entry fails here, in the fast lane, and
      # not first in the image build (T-0616).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --locked
      # The rustdoc of a jc-core field is the JSON Schema `description` the Portal ships, the
      # OpenAPI document publishes and every MCP tool list hands a model, so a broken
      # intra-doc link is a broken sentence in four places (T-2145, UI-02). One crate, no
      # dependencies: seconds, which is why it belongs in the fast lane and the workspace-wide
      # doc build stays in ci-full.
      - run: cargo doc -p jc-core --no-deps --locked
        env: { RUSTDOCFLAGS: "-D warnings" }
      # And the contract those descriptions make: every field has one, and none of them is a
      # credential. `--lib --bins` above does not run an integration test (T-2145).
      - run: cargo test -p jc-core --test kind_documentation_tests --locked
      # Every environment variable a service reads is explained where it is read, and no
      # secret is read into a log line (T-2140, OPS-27). The configuration reference in the
      # docs is generated from those sentences, so a variable added without one is caught
      # here rather than a lane later.
      - run: cargo test -p jc-core --test configuration_documentation_tests --locked
      # Every variant of an Endpoint's DCAT-AP record against the SEMIC DCAT-AP 3.0 shapes pinned
      # in the repository, and its JSON-LD and Turtle as one graph (T-2789, EP-78). The test
      # writes the records, pyshacl reads them: one test binary and a pip install, under a minute.
      - run: cargo test -p context-gateway --test dcat_ap_catalog_tests --locked
        env: { DCAT_RECORDS_DIR: "${{ runner.temp }}/dcat-records" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install --quiet --disable-pip-version-check pyshacl==0.30.1
      - run: python3 scripts/ci/validate-dcat-ap.py "${{ runner.temp }}/dcat-records"
  model-tools:
    # The one non-Rust component (Architecture/11 §6.5). It runs beside the Rust job rather
    # than after it, so the fast lane stays as long as its slowest job and no longer.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: tools/model-tools } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: "pip", cache-dependency-path: tools/model-tools/pyproject.toml }
      - run: pip install .[test]
      # SDK-10: `test_gen_typescript` compiles jc-types.ts with the TypeScript the SDK pins.
      - run: npm install -g typescript@5.9.3
      # DM-39's golden tests run the compiled Bloblang through the Bento the cluster runs, by
      # digest. Pulling it here rather than inside the first test that needs it turns a
      # registry outage into a step that says so.
      - run: docker pull ghcr.io/warpstreamlabs/bento@sha256:656c55de3f8deddd4ee743f3c76f3b497e67324e940f2bc1769693cd8b906364
      - run: pytest -q
      # DM-02: a committed artifact must equal what this generator renders now, or the schema a
      # partner reads is not the schema the source says. The check lives in this job because
      # the Model Tools it needs is already installed here, and it runs `jcctl model diff` —
      # the same code path the Portal preview and an agent use, which is the point of DM-32.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Every DataModel's artifacts are the ones this generator renders
        working-directory: ${{ github.workspace }}
        env:
          MODEL_TOOLS_MODELS: tools/model-tools/models
        run: |
          python3 -m service --host 127.0.0.1 --port 8080 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          # Exit 2 means a committed artifact is stale: regenerate with `jcctl model generate`
          # and commit the result beside the source (DM-01, DM-02).
          cargo run -q -p jcctl -- model diff --repo-dir examples/datamodels --url http://127.0.0.1:8080
  pipelines:
    # PL-21, PL-22: the shipped ingestion examples are linted and run against their golden fixtures.
    # Bento is pinned by version and verified by checksum, the way an image is pinned by digest.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENTO_VERSION: "1.21.1"
      BENTO_SHA256: "bde76909dfba1173a0338886f747b4a4647c316d9627c1c0472d8a1cc1eda453"
      # `bento lint` refuses a config whose environment interpolations are unset; the runner
      # gets the real token from its ServiceAccount, CI only needs the name to resolve.
      SERVICE_ACCOUNT_TOKEN: "lint-placeholder"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bento
        run: |
          curl -sSLo bento.tar.gz "https://github.com/warpstreamlabs/bento/releases/download/v${BENTO_VERSION}/bento_${BENTO_VERSION}_linux_amd64.tar.gz"
          echo "${BENTO_SHA256}  bento.tar.gz" | sha256sum --check --status
          tar xzf bento.tar.gz bento
          sudo install -m 0755 bento /usr/local/bin/bento
      # Only the Bento configs: the folders also hold platform manifests, which are a
      # different schema and are checked by `cargo test -p jcctl`.
      - run: bento lint ./examples/ingestion/*/bento.yaml ./examples/ingestion/gtfs-rt/tests/decoder.yaml
      - run: bento test ./examples/ingestion/...
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
