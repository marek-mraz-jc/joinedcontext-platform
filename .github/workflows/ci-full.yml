name: ci-full
# the slow lane: runs once an hour on main and on demand; never a PR gate.
# The MVP pushes to main many times an hour, and a full run per push queued behind the next
# one; ci.yml stays the per-push gate. tasks/ci files a task for a red hourly run like any other.
# To put the per-push trigger back: add `push: { branches: [main] }` under `on:`.
on:
  schedule: [{ cron: "7 */3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-full-${{ github.ref }}", cancel-in-progress: false }
jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PDFium the assistant crate links, pinned and checked; kreuzberg's build would
      # otherwise fetch the newest release unchecked (T-3052).
      - run: sh scripts/ci/pdfium.sh "$RUNNER_TEMP/pdfium" && echo "KREUZBERG_PDFIUM_PREBUILT=$RUNNER_TEMP/pdfium" >> "$GITHUB_ENV"
      # The knowledge assistant's store against the cluster's own PostgreSQL image, pinned in
      # deployment's components/postgres/images.yaml (pgvector 0.8.6, T-3050). The image has no
      # entrypoint of its own (CloudNativePG drives it), so the step initialises and starts it.
      - run: >-
          docker run -d --name assistant-pg -p 5432:5432 --entrypoint bash
          ghcr.io/cloudnative-pg/postgis@sha256:9d597fcf4350e4bae9ff40cbe0e4383746a9c7f9c60da72483b0e966e4c20765
          -c 'export PATH=/usr/lib/postgresql/16/bin:$PATH; initdb -D /tmp/pg -U postgres --auth=trust >/dev/null
          && echo "host all all 0.0.0.0/0 trust" >> /tmp/pg/pg_hba.conf
          && exec postgres -D /tmp/pg -c listen_addresses=* -c unix_socket_directories=/tmp'
          && for i in $(seq 1 30); do docker exec assistant-pg /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - run: cargo test --workspace --all-targets --all-features
        env:
          JC_ASSISTANT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
  readme:
    # Every command the README tells a newcomer to type is run here (T-2144, TS-19). A
    # renamed crate, a moved script or a flag that no longer exists then fails a lane rather
    # than somebody's first hour. Only the Build and Test sections run; "Run locally" starts
    # a server and is read by eye.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the extractor reads what it is meant to read
        run: python3 scripts/ci/check-readme-commands.py --selftest
      - run: python3 scripts/ci/check-readme-commands.py
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: "cargo-audit,cargo-deny" }
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
