name: ship
# builds, smoke-tests and pushes the OCI image(s) after each green ci on main, once a day on a
# quiet main (its Debian fixes, T-5485) and on tags; skipped
# until a Dockerfile exists. The ship lane of T-4721: the file keeps the name image.yml because the
# signing identity (`.github/workflows/image.yml@refs/heads/main`) is what pin-images verifies.
# A green ci on main starts a run (T-5449): GitHub's cron fired none of the 05:37-08:37Z slots on
# 2026-10-23, so the cron stays only as a fallback. pin-images (deployment) pins the newest commit
# this lane built. No hourly wait any more (T-6109): the repo is public, so the minutes T-4696
# saved cost nothing, and the gate held a merge's image back up to 40 min (2026-10-29). The gate
# concurrency group still runs one `changes` at a time with the newest commit pending.
# T-6154: the binaries compile once outside Docker with a warm cache (`compile`), the image only
# copies them; the SBOM, its attestation and the vulnerability gate moved to image-scan.yml, which
# runs on this lane's green run, so the pin no longer waits for them; production does (release gate).
on:
  schedule: [{ cron: "37 * * * *" }]
  # ci completed: the green main commit. ci-full requested: the daily ci-full's commit gets its
  # images too, so promote.yml can attest the tested digest. The other two pairs (ci requested,
  # ci-full completed) end as skipped runs at `changes`' if.
  workflow_run: { workflows: [ci, ci-full], types: [requested, completed], branches: [main] }
  push:
    tags: ["v*"]
  workflow_dispatch:
# Read-only by default: only a job that publishes may hold the permissions that push an image
# under the project's name and mint its signing identity (T-0851).
permissions: { contents: read }
# NOT cancel-in-progress, unlike the test lanes: this lane's output is an artifact, not a
# verdict, and `dev-apply` deploys it. With merges a few minutes apart, cancelling killed five
# builds in a row on 2026-09-20 and `:main` stayed on the one commit that happened to be
# followed by a quiet five minutes, which is not how `dev` trails `main` by an hour (T-2318).
# Main runs are keyed by commit (T-5024, as ci.yml in T-5022): GitHub keeps one pending run per
# concurrency group, so with image-<ref> each merge replaced the pending main run and most main
# commits got no image to pin. Every main commit now publishes its own `:sha`; runs may overlap,
# so `:main` can briefly name an older commit. Deployments pin digests, never `:main`.
concurrency:
  group: "image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}"
  cancel-in-progress: false
jobs:
  # The cron, a green ci and ci-full's request build when main moved since the newest green run of
  # this lane on main, model-tools only when its folder changed; a tag, a dispatch or a last build git cannot
  # diff builds everything (T-4696).
  changes:
    # workflow_run runs main's workflow with its secrets whatever triggered it: only a green ci of
    # a push to main in this repository, on the commit main still points at (a newer commit's ci
    # comes after), and ci-full's request start a build; github.sha is always main's head.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'ci-full' && github.event.action == 'requested') ||
      (github.event.workflow_run.name == 'ci' && github.event.action == 'completed' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # gap 0: the gate only names the last built commit (scripts/ci/image-gate.py), no wait.
    timeout-minutes: 10
    # One run decides at the gate, the newest commit pends behind it and replaces an older pending
    # one; the replaced run ends cancelled, its commit is in the newer one. ci-full's request, a
    # tag and a dispatch never wait.
    concurrency:
      group: "${{ (github.event_name == 'schedule' || github.event.workflow_run.name == 'ci') && 'image-gate' || format('image-gate-{0}', github.run_id) }}"
      cancel-in-progress: false
    permissions: { contents: read, actions: read }
    outputs:
      build: ${{ steps.pick.outputs.build }}
      model-tools: ${{ steps.pick.outputs.model-tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          build=true models=true
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_run ]; then
            gate=$(python3 scripts/ci/image-gate.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" 0)
            read -r built refresh <<< "$gate"
            # built on an earlier UTC day: rebuild so APT_REFRESH takes today's Debian fixes
            # (T-5485); model-tools has no such layer, its rebuild would be all cache hits
            if [ "$built" = "$GITHUB_SHA" ] && [ "${refresh:-}" = refresh ]; then
              models=false
            elif [ "$built" = "$GITHUB_SHA" ]; then
              build=false models=false
            elif [ -n "$built" ] && git cat-file -e "${built}^{commit}" 2>/dev/null; then
              git diff --name-only "$built" "$GITHUB_SHA" | grep -q '^tools/model-tools/' || models=false
            fi
          fi
          echo "built: ${built:-none} ${refresh:-}; build=$build model-tools=$models"
          printf 'build=%s\nmodel-tools=%s\n' "$build" "$models" >> "$GITHUB_OUTPUT"
  # The binaries compile once, here, in the build stage's own base image (same glibc as the runtime,
  # T-4126) with the dependency cache of the last release build, not cold inside Docker: the docker
  # build step took 555-789 s per run that way (T-6154). The Dockerfile's `build` stage is what a
  # local `docker build` runs; this lane hands the image builds these binaries in its place.
  compile:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: rust:1.97-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c
    permissions: { contents: read }
    timeout-minutes: 30
    env: { KREUZBERG_PDFIUM_PREBUILT: /opt/pdfium }
    steps:
      # the build stage's packages (Dockerfile), plus zstd and git for the cache and checkout actions
      - run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev curl ca-certificates g++ libclang-dev make git zstd && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh scripts/ci/pdfium.sh /opt/pdfium
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: image-release, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # Two invocations, so kreuzberg's serde_json `preserve_order` stays in the assistant and never
      # reorders what the gateway and jcctl write (T-3206); the Dockerfile builds the same way.
      - run: |
          cargo build --release --locked --workspace --exclude assistant --features context-gateway/jemalloc
          cargo build --release --locked -p assistant
          mkdir -p dist/src/target/release
          for bin in context-gateway jcctl jc-agent-proxy jc-functions jc-assistant jc-token-sidecar jc-camera-sim jc-wasm-host; do
            strip -o "dist/src/target/release/$bin" "target/release/$bin"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: binaries, path: dist, retention-days: 1, if-no-files-found: error }
  # Push and sign only: the SBOM, its attestation and the vulnerability gate run after this lane in
  # image-scan.yml, so pin-images (which waits for this run) is not held by them. Dev takes a signed
  # digest; production takes only one image-scan.yml attested (deployment verify-pinned-images.py
  # --scanned in the release gate, T-6154).
  build:
    needs: compile
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: binaries, path: "${{ runner.temp }}/build" }
      # The named context `build` stands in for the Dockerfile's build stage: every `COPY --from=build`
      # reads this directory, laid out as that stage's filesystem.
      - name: the build stage's files
        run: |
          set -eu
          chmod +x "$RUNNER_TEMP"/build/src/target/release/*
          sh scripts/ci/e5-small.sh "$RUNNER_TEMP/build/opt/e5-small"
          sh scripts/ci/onnxruntime.sh "$RUNNER_TEMP/build/opt/onnxruntime"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Built into the runner's docker first and started there, so only bytes that answer get
      # pushed; the push below is the same build again, every layer a cache hit (T-4721).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: build=${{ runner.temp }}/build
          build-args: APT_REFRESH=${{ steps.day.outputs.d }}
          load: true
          tags: platform-local:latest
      - name: the gateway starts, answers /healthz and refuses an unknown Endpoint
        run: |
          docker run -d --name gw -p 8080:8080 -e JC_GATEWAY_BROKER_URL=http://127.0.0.1:9 \
            -e JC_GATEWAY_ORG_DOMAIN=smoke.example platform-local:latest
          for _ in $(seq 30); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 1; done
          fail() { echo "SMOKE: $1"; docker logs gw | tail -40; exit 1; }
          curl -sf localhost:8080/healthz >/dev/null || fail "no /healthz after 30 s"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/endpoint/nope/ngsi-ld/v1/types)
          [ "$code" = 404 ] || fail "an unknown Endpoint answered $code"
          docker rm -f gw >/dev/null
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: build=${{ runner.temp }}/build
          build-args: APT_REFRESH=${{ steps.day.outputs.d }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:main,ghcr.io/${{ github.repository }}:dev-${{ github.run_number }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      - run: echo "digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # The checkouts sidecar (T-2646): jcctl of this commit on Debian with git; its apt layer is
      # cached per day (APT_REFRESH).
      - id: checkouts
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: build=${{ runner.temp }}/build
          target: checkouts
          build-args: APT_REFRESH=${{ steps.day.outputs.d }}
          push: true
          tags: ghcr.io/${{ github.repository }}/checkouts:${{ github.sha }},ghcr.io/${{ github.repository }}/checkouts:main,ghcr.io/${{ github.repository }}/checkouts:dev-${{ github.run_number }}
          cache-from: type=gha,scope=checkouts
          cache-to: type=gha,mode=max,scope=checkouts
          provenance: true
          sbom: true
      - run: cosign sign --yes ghcr.io/${{ github.repository }}/checkouts@${{ steps.checkouts.outputs.digest }}
      - run: echo "checkouts digest ${{ steps.checkouts.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # tini is PID 1 and reaps the orphans git leaves behind (T-5638: 18,673 zombies per pod).
      - name: the checkouts image reaps orphaned processes
        run: |
          docker pull -q "ghcr.io/${{ github.repository }}/checkouts@${{ steps.checkouts.outputs.digest }}"
          scripts/ci/checkouts-reaps-orphans.sh "ghcr.io/${{ github.repository }}/checkouts@${{ steps.checkouts.outputs.digest }}"
  model-tools:
    needs: changes
    if: needs.changes.outputs.model-tools == 'true'
    # The one non-Rust runtime component (Architecture/11 §6.5, DM-18) is its own image: a
    # Python image carrying LinkML has nothing in common with the distroless Rust one, and the
    # Portal reaches it over HTTP, not by running a binary out of the platform image.
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: tools/model-tools
          push: true
          tags: ghcr.io/${{ github.repository }}/model-tools:${{ github.sha }},ghcr.io/${{ github.repository }}/model-tools:main,ghcr.io/${{ github.repository }}/model-tools:dev-${{ github.run_number }}
          cache-from: type=gha,scope=model-tools
          cache-to: type=gha,mode=max,scope=model-tools
          provenance: true
          sbom: true
      - name: the image renders the preview, with the generator version it pins (DM-19)
        # The packaging is what breaks here, not the code: an image that cannot resolve the
        # shipped `ngsi-ld-core` import answers 200 with errors and no artifacts, which a unit
        # test run from the source tree never sees.
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}/model-tools@${{ steps.push.outputs.digest }}"
          docker run -d --name model-tools -p 8080:8080 "$image"
          for _ in $(seq 30); do curl -sf localhost:8080/healthz >/dev/null && break || sleep 1; done
          jq -Rs '{source: .}' tools/model-tools/tests/fixtures/senzor.linkml.yaml > body.json
          curl -sf -H 'content-type: application/json' -d @body.json localhost:8080/generate > out.json
          jq -e '.errors == [] and (.jsonSchema | type == "object") and (.context["@context"].Entity | length > 0) and (.brokerSchema.classes.AirQualityObserved.is_a == "Entity")' out.json
          pinned=$(grep -o 'linkml==[0-9.]*' tools/model-tools/pyproject.toml | head -1 | cut -d= -f3)
          jq -e --arg v "$pinned" '.generatorVersion == "linkml-" + $v' out.json
          docker rm -f model-tools
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ghcr.io/${{ github.repository }}/model-tools@${{ steps.push.outputs.digest }}
      - run: echo "model-tools digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  # Starts pin-images in the deployment as soon as the images are signed (T-6154). workflow_run
  # does not cross repositories, so this sends a repository_dispatch with a token that may only
  # do that (secret DEPLOYMENT_DISPATCH_TOKEN, fine-grained, contents: write on the deployment
  # repository); without it pin-images still runs on its cron.
  notify:
    needs: [build, model-tools]
    if: always() && needs.build.result == 'success' && needs.model-tools.result != 'failure' && needs.model-tools.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    env:
      TOKEN: ${{ secrets.DEPLOYMENT_DISPATCH_TOKEN }}
    steps:
      - run: |
          set -eu
          [ -n "$TOKEN" ] || { echo "no DEPLOYMENT_DISPATCH_TOKEN: pin-images picks this commit up on its cron"; exit 0; }
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/joinedcontext-deployment/dispatches" \
            -d "{\"event_type\":\"image-pushed\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
