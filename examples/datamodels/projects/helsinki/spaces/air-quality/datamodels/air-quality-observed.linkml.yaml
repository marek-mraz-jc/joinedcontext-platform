# The authoring source. Everything beside it is generated from this file and is never
# hand-edited (DM-01); `jcctl model generate` writes them and CI fails on any difference.
id: https://hel.fi/ns/air-quality
name: air-quality-observed
title: Air quality observed
description: One air quality reading of one station, as the demo instance publishes it.
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml: https://w3id.org/linkml/
  hel: https://hel.fi/ns/
  # The vocabularies the unit mappings cite; a CURIE under an undeclared prefix dangles in
  # every artifact that carries it (DM-59).
  unece: https://vocabulary.uncefact.org/UnitMeasureCode#
  qudt-unit: http://qudt.org/vocab/unit/
  qudt-quantkind: http://qudt.org/vocab/quantitykind/
default_prefix: hel
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

classes:
  AirQualityObserved:
    class_uri: hel:AirQualityObserved
    description: One reading of one air quality station.
    is_a: Entity
    slots: [dateObserved, pm25, temperature, stationName, refStation]

slots:
  dateObserved:
    slot_uri: hel:dateObserved
    description: When the reading was taken.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
  pm25:
    slot_uri: hel:pm25
    description: Mass concentration of particles smaller than 2.5 micrometres.
    range: float
    required: true
    unit:
      ucum_code: ug/m3
      symbol: "µg/m³"
      exact_mappings:
        - unece:GQ
        - qudt-unit:MicroGM-PER-M3
      has_quantity_kind: qudt-quantkind:MassDensity
    annotations:
      ngsi_ld_kind: Property
  temperature:
    slot_uri: hel:temperature
    description: Air temperature at the station.
    range: float
    unit:
      ucum_code: Cel
      symbol: "°C"
      exact_mappings:
        - unece:CEL
        - qudt-unit:DEG_C
      has_quantity_kind: qudt-quantkind:Temperature
    annotations:
      ngsi_ld_kind: Property
  stationName:
    slot_uri: hel:stationName
    description: What the station is called, per locale.
    annotations:
      ngsi_ld_kind: LanguageProperty
  refStation:
    slot_uri: hel:refStation
    description: The station that produced the reading.
    annotations:
      ngsi_ld_kind: Relationship
