# The capital region's service map (palvelukartta) publishes every public service point through
# this API. No credential, so the source declares none; HTTPS all the same, because an
# unencrypted fetch is a fetch anybody on the path can rewrite.
#
# The query names one service node and one municipality so that the answer is complete in a
# single page: `service_node=1061` is public safety, ninety-three units in Helsinki. The API asks
# callers to keep their request rate modest, which is what the hourly cadence and the one
# request per run are for; a wider query would have to follow `next` and would poll far harder.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-servicemap-units
  namespace: helsinki
  title:
    fi: Pääkaupunkiseudun palvelukartan toimipisteet
    en: Helsinki region service map units
spec:
  type: http
  http:
    url: https://api.hel.fi/servicemap/v2/unit/?municipality=helsinki&service_node=1061&page_size=200
    verb: GET
    headers:
      Accept: application/json
    timeout: 30s
