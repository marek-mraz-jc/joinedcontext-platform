# Golden transformation tests for the HSL HFP pipeline (PL-22, T-0295).
#
#   bento test ./examples/ingestion/hsl-hfp-mqtt/...
#
# The file is named after the config it tests: Bento pairs `<name>_bento_test.yaml` with
# `<name>.yaml` in the same folder, which is why the tests are not in a `tests/` subfolder.

tests:
  - name: one journey frame becomes one Vehicle entity
    target_processors: '/pipeline/processors'
    # The reconciler injects this from the project's Organization (PF-44); the demo
    # instance is hel.fi, so the golden ids below are the ones that runner would mint.
    environment:
      JC_ORG_DOMAIN: hel.fi
    input_batch:
      - content: '{"VP":{"desi":"550","dir":"1","oper":22,"veh":787,"tst":"2026-09-06T21:00:01.000Z","spd":8.3,"hdg":126,"lat":60.191,"long":24.901,"route":"2550","occu":0,"loc":"GPS"}}'
    output_batches:
      - - json_equals: [
            {
              "@context": [
                "https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context-v1.8.jsonld",
                "https://smartdatamodels.org/context.jsonld"
              ],
              "id": "urn:ngsi-ld:Vehicle:hel.fi:transport:22-787",
              "type": "Vehicle",
              "location": {
                "type": "GeoProperty",
                "value": {
                  "type": "Point",
                  "coordinates": [
                    24.901,
                    60.191
                  ]
                },
                "observedAt": "2026-09-06T21:00:01.000Z"
              },
              "speed": {
                "type": "Property",
                "value": 8.3,
                "unitCode": "MTS",
                "observedAt": "2026-09-06T21:00:01.000Z"
              },
              "heading": {
                "type": "Property",
                "value": 126,
                "unitCode": "DD",
                "observedAt": "2026-09-06T21:00:01.000Z"
              },
              "route": {
                "type": "Property",
                "value": "2550",
                "observedAt": "2026-09-06T21:00:01.000Z"
              },
              "vehicleType": {
                "type": "Property",
                "value": "bus"
              },
              "fleetVehicleId": {
                "type": "Property",
                "value": "22-787"
              }
            }
          ]

  - name: a frame that is not a position report is dropped
    target_processors: '/pipeline/processors'
    input_batch:
      - content: '{"DUE":{"oper":22,"veh":787,"ttarr":"2026-09-06T21:02:00Z"}}'
    output_batches: []

  # The cap is what the demo promises: thirty buses, the same thirty, however many the feed
  # carries. The last frame repeats a bus that was already admitted, and it stays admitted.
  - name: a stream of thirty-four buses yields exactly the first thirty
    target_processors: '/pipeline/processors'
    # The reconciler injects this from the project's Organization (PF-44); the demo
    # instance is hel.fi, so the golden ids below are the ones that runner would mint.
