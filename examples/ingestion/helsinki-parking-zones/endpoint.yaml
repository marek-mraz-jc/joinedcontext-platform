# The surface the pipeline writes into and the public reads from (EP-01, EP-05, EP-14), and the
# open-data catalogue it is published to (EP-62).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: ep-parking-zones
  namespace: helsinki
  title:
    fi: Pysäköintialueet
    en: Parking areas
spec:
  contextSpaceRef: { kind: ContextSpace, name: parking }
  slug: xkedswtzd5bbevafpug36hechd
  audience: public
  enabledRepresentations: [ngsi-ld, geojson, csv, ogc-features, sta, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: open-data }
      organization: city-of-helsinki
      name: street-parking-zones
      datastore: { representation: csv, refresh: onChange }
