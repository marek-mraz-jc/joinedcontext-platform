# Golden transformation tests for the CSV pipeline (PL-22, T-0296).
#
#   bento test ./examples/ingestion/csv-fetch/...

tests:
  - name: one CSV file becomes one entity per row
    target_processors: '/pipeline/processors'
    # The reconciler injects this from the project's Organization (PF-44); the demo
    # instance is hel.fi, so the golden ids below are the ones that runner would mint.
    environment:
      JC_ORG_DOMAIN: hel.fi
    input_batch:
      - content: |
          id,name,lat,lon,capacity,free,at
          p-kamppi,Kamppi,60.1690,24.9310,120,30,2026-09-06T21:00:00Z
          p-kluuvi,Kluuvi,60.1700,24.9450,400,400,2026-09-06T21:00:00Z
    output_batches:
      - - json_equals: [
            {
              "@context": [
                "https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context-v1.8.jsonld",
                "https://smartdatamodels.org/context.jsonld"
              ],
              "id": "urn:ngsi-ld:OffStreetParking:hel.fi:transport:p-kamppi",
              "type": "OffStreetParking",
              "name": { "type": "Property", "value": "Kamppi" },
              "location": {
                "type": "GeoProperty",
                "value": { "type": "Point", "coordinates": [24.9310, 60.1690] }
              },
              "totalSpotNumber": { "type": "Property", "value": 120 },
              "availableSpotNumber": {
                "type": "Property", "value": 30, "observedAt": "2026-09-06T21:00:00Z"
              },
              "occupancy": {
                "type": "Property", "value": 0.75, "observedAt": "2026-09-06T21:00:00Z"
              }
            },
            {
              "@context": [
                "https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context-v1.8.jsonld",
                "https://smartdatamodels.org/context.jsonld"
              ],
              "id": "urn:ngsi-ld:OffStreetParking:hel.fi:transport:p-kluuvi",
              "type": "OffStreetParking",
              "name": { "type": "Property", "value": "Kluuvi" },
              "location": {
                "type": "GeoProperty",
                "value": { "type": "Point", "coordinates": [24.9450, 60.1700] }
              },
              "totalSpotNumber": { "type": "Property", "value": 400 },
              "availableSpotNumber": {
                "type": "Property", "value": 400, "observedAt": "2026-09-06T21:00:00Z"
              },
              "occupancy": {
                "type": "Property", "value": 0, "observedAt": "2026-09-06T21:00:00Z"
              }
            }
          ]

  - name: a header with no rows writes nothing
    target_processors: '/pipeline/processors'
    input_batch:
      - content: |
          id,name,lat,lon,capacity,free,at
    output_batches: []
