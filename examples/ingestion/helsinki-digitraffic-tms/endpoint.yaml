# The surface the pipeline writes into and the public reads from (EP-01, EP-05, EP-14), and the
# open-data catalogue it is published to (EP-62).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: ep-traffic
  namespace: helsinki
  title:
    fi: Liikennemäärät
    en: Traffic flow
spec:
  contextSpaceRef: { kind: ContextSpace, name: traffic }
  slug: vbsb5w7hk5hypmpum5obi3pcau
  audience: public
  enabledRepresentations: [ngsi-ld, geojson, csv, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: open-data }
      organization: city-of-helsinki
      name: traffic-flow-observed
      datastore: { representation: csv, refresh: onChange }
