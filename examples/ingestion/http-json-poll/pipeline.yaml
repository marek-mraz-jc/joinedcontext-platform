# Five minutes is past the thirty-second rule, so `auto` makes this a CronJob that scales to
# zero between runs (PL-26).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: aq-http-poll
  namespace: helsinki
  title:
    en: Air quality by polling the open-data API
spec:
  class: auto
  period: 5m
  source:
    dataSourceRef: { kind: DataSource, name: aq-opendata }
  targetEndpoint: urn:ngsi-ld:Endpoint:hel.fi:air-quality:ep-air
  quotas:
    maxMemoryMb: 64
    cpuMillicores: 100
