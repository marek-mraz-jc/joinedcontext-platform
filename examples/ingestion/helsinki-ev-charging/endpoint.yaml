# The surface the pipeline writes into and the public reads from (EP-01, EP-05, EP-14), and the
# open-data catalogue it is published to (EP-62).
#
# The entities are derived from OpenStreetMap, which is licensed under the ODbL: the attribution
# travels on every entity as `dataProvider`, and the catalogue dataset this publication creates
# carries the same licence. Nothing in this manifest sets it, because a licence is a field of the
# CKAN dataset and not of the Endpoint; it is set once on the catalogue side.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: ep-ev-charging
  namespace: helsinki
  title:
    fi: Sähköauton latauspisteet
    en: EV charging stations
spec:
  contextSpaceRef: { kind: ContextSpace, name: charging }
  slug: 2j24lifsjj6soaqvleydeo4n5v
  audience: public
  enabledRepresentations: [ngsi-ld, geojson, csv, ogc-features, sta, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: open-data }
      organization: city-of-helsinki
      name: ev-charging-stations
      datastore: { representation: csv, refresh: onChange }
