[advisories]
ignore = [
  # paste 1.0.15 is unmaintained (not a vulnerability): a build-time proc-macro of tokenizers
  # (crates/assistant: tokenizers 0.23.2 -> paste; tokenizers 1.0 still pulls it through
  # tk-encode). No maintained upgrade path; owner decision (a) on T-3209 (T-3191, T-3202).
  "RUSTSEC-2024-0436",
  # unsafe-libyaml 0.2.11 is unmaintained (not a vulnerability): crates/assistant: kreuzberg
  # 4.10.4 -> serde_yaml_ng 0.10 -> unsafe-libyaml, a required dependency of every kreuzberg
  # release up to 5.0.0-rc.35, so no upgrade removes it. No crate here parses YAML with it: the
  # assistant hands kreuzberg HTML pages and the document types of crawl::links::is_document_type
  # only (extract::document_type, test a_document_is_read_only_as_a_document_type), never YAML.
  # Decided on T-4070 like RUSTSEC-2024-0436 on T-3209; drop it when kreuzberg drops the crate.
  "RUSTSEC-2024-0449",
  # zip 8.6.0 under kreuzberg 4.10.4 and calamine 0.36.1: RUSTSEC-2026-0367/0368/0369 sit in
  # ZipArchive::extract / ZipStreamReader::extract (unpacking to disk), which neither crate nor
  # ours calls; reason, grep evidence and exit condition in .cargo/audit.toml (T-4524, owner
  # decision 2026-10-18). Remove when kreuzberg accepts zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # basic-toml 0.1.10 is unmaintained (not a vulnerability): a build-time read of i18n.toml in
  # age's i18n-embed-fl proc-macro (jcctl -> age 0.12.1 -> i18n-embed-fl 0.10.1 -> i18n-config
  # 0.4.8, the newest of each). age decrypts the pipelines' SOPS files, so it stays; no release
  # drops basic-toml yet. Same decision as the portal's (T-4816); drop it when i18n-config does.
  "RUSTSEC-2026-0374",
]
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "MIT-0", "OpenSSL",
  # finl_unicode 1.5.0 (crates/assistant: kreuzberg 4.10.4 -> comrak 0.55 -> finl_unicode),
  # which every version carries; the OSI-approved predecessor of Unicode-3.0. Owner decision (a)
  # on T-3209 (T-3191, T-3202).
  "Unicode-DFS-2016",
]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/marek-mraz-jc/joinedcontext-platform",
  # The NGSI-LD crates of the default broker, which the gateway judges grant conditions and
  # WebSocket filters with (T-3530, T-3913); pinned by tag in crates/context-gateway/Cargo.toml.
  "https://github.com/marek-mraz-jc/ngsild",
]
