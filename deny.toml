[advisories]
ignore = [
  # paste 1.0.15 is unmaintained (not a vulnerability): a build-time proc-macro of tokenizers
  # (crates/assistant: tokenizers 0.23.2 -> paste; tokenizers 1.0 still pulls it through
  # tk-encode). No maintained upgrade path; owner decision (a) on T-3209 (T-3191, T-3202).
  "RUSTSEC-2024-0436",
]
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "MIT-0", "OpenSSL",
  # finl_unicode 1.5.0 (crates/assistant: kreuzberg 4.10.4 -> comrak 0.55 -> finl_unicode),
  # which every version carries; the OSI-approved predecessor of Unicode-3.0. Owner decision (a)
  # on T-3209 (T-3191, T-3202).
  "Unicode-DFS-2016",
]
# Mozilla's CA bundle as data, no code: antares-ql -> antares-jsonld -> reqwest 0.13 ->
# rustls-platform-verifier, a context loader the gateway never calls (T-3530). This crate only.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" }]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/marek-mraz-jc/joinedcontext-platform",
  # The default broker's query-language crates, which the gateway judges grant conditions with
  # (T-3530); pinned by rev in crates/context-gateway/Cargo.toml.
  "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker",
]
