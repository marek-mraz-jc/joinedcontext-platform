# The platform's blueprint library (CC-28): a dataset published as open data. One public
# Endpoint carries both halves: its DCAT-AP catalogue record (EP-78) registers the dataset, and
# its CKAN publication (EP-62) is the open-data view a portal harvests.
apiVersion: joinedcontext.com/v1alpha1
kind: Blueprint
metadata:
  name: dataset-publication
  namespace: org
  title: { en: "Publish a dataset as open data", fi: "Julkaise aineisto avoimena datana", sk: "Zverejniť dataset ako otvorené dáta", cs: "Zveřejnit datovou sadu jako otevřená data", de: "Einen Datensatz als offene Daten veröffentlichen" }
  description:
    en: "Publishes a context space as a dataset in the open-data portal, with its licence and contact."
    sk: "Zverejní kontextový priestor ako dataset v portáli otvorených dát, s licenciou a kontaktom."
    cs: "Zveřejní kontextový prostor jako datovou sadu v portálu otevřených dat, s licencí a kontaktem."
    de: "Veröffentlicht einen Kontextbereich als Datensatz im Open-Data-Portal, mit Lizenz und Kontakt."
spec:
  version: 1.0.0
  category: publication
  # Public by construction: an organization admin reviews what leaves the organization.
  riskClass: red
  allowedRoles: [portal-approver]
  parameterSchema:
    type: object
    required: [name, space, publisher, contactName, contactEmail, license, ckanInstance, ckanOrganization, endpointSlug]
    additionalProperties: false
    properties:
      name: { type: string, title: "Dataset name", x-jc-title: { sk: "Názov datasetu", cs: "Název datové sady", de: "Name des Datensatzes" }, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "One word with hyphens; names the Endpoint and the CKAN dataset.", x-jc-description: { sk: "Jedno slovo so spojovníkmi; pomenuje Endpoint a dataset v CKAN.", cs: "Jedno slovo se spojovníky; pojmenuje Endpoint a datovou sadu v CKAN.", de: "Ein Wort mit Bindestrichen; benennt den Endpoint und den CKAN-Datensatz." } }
      space: { type: string, title: "Context space published", x-jc-title: { sk: "Zverejňovaný kontextový priestor", cs: "Zveřejňovaný kontextový prostor", de: "Veröffentlichter Kontextbereich" }, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$", x-jc-widget: resourcePicker, x-jc-options: { plural: spaces } }
      publisher: { type: string, title: "Publisher", x-jc-title: { sk: "Vydavateľ", cs: "Poskytovatel", de: "Herausgeber" }, pattern: '^[^"\\\x00-\x1f]{2,200}$' }
      contactName: { type: string, title: "Contact (a role, not a person)", x-jc-title: { sk: "Kontakt (rola, nie osoba)", cs: "Kontakt (role, ne osoba)", de: "Kontakt (eine Rolle, keine Person)" }, pattern: '^[^"\\\x00-\x1f]{2,200}$' }
      contactEmail: { type: string, title: "Contact e-mail", x-jc-title: { sk: "Kontaktný e-mail", cs: "Kontaktní e-mail", de: "Kontakt-E-Mail" }, format: email, pattern: '^[^@\s"\\]+@[^@\s"\\]+\.[^@\s"\\]+$' }
      license:
        type: string
        title: "Licence"
        x-jc-title: { sk: "Licencia", cs: "Licence", de: "Lizenz" }
        default: CC_BY_4_0
        oneOf:
          - { const: CC0, title: "CC0 1.0" }
          - { const: CC_BY_4_0, title: "CC BY 4.0" }
          - { const: CC_BYSA_4_0, title: "CC BY-SA 4.0" }
          - { const: ODC_BY, title: "ODC Attribution" }
          - { const: ODC_ODBL, title: "ODC Open Database Licence" }
          - { const: ODC_PDDL, title: "ODC Public Domain Dedication" }
      theme:
        type: string
        title: "EU data theme"
        x-jc-title: { sk: "Téma údajov EÚ", cs: "Téma dat EU", de: "EU-Datenthema" }
        default: GOVE
        enum: [AGRI, ECON, EDUC, ENER, ENVI, GOVE, HEAL, INTR, JUST, REGI, SOCI, TECH, TRAN]
      frequency:
        type: string
        title: "Updated"
        x-jc-title: { sk: "Aktualizované", cs: "Aktualizováno", de: "Aktualisiert" }
        default: DAILY
        enum: [CONT, HOURLY, DAILY, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, IRREG]
      ckanInstance: { type: string, title: "Open-data portal", x-jc-title: { sk: "Portál otvorených dát", cs: "Portál otevřených dat", de: "Open-Data-Portal" }, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$", x-jc-widget: resourcePicker, x-jc-options: { plural: ckaninstances } }
      ckanOrganization: { type: string, title: "Organization in the open-data portal", x-jc-title: { sk: "Organizácia v portáli otvorených dát", cs: "Organizace v portálu otevřených dat", de: "Organisation im Open-Data-Portal" }, pattern: "^[a-z0-9][a-z0-9_-]{1,99}$" }
      endpointSlug: { type: string, title: "Endpoint slug", x-jc-title: { sk: "Slug endpointu", cs: "Slug endpointu", de: "Endpoint-Slug" }, pattern: "^[a-z2-7]{26,64}$", x-jc-widget: endpointSlug, description: "Minted by the platform; nobody types it.", x-jc-description: { sk: "Vytvorí ho platforma; nikto ho nepíše.", cs: "Vytvoří ho platforma; nikdo ho nepíše.", de: "Von der Plattform erzeugt; niemand tippt ihn ein." } }
  # A parameter with a default is filled by the form; a caller of the API may leave it out, so
  # every template names the same default again.
  templates:
    - name: endpoint
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: Endpoint
        metadata:
          name: "{{ name }}"
          title: { en: "{{ name }}" }
        spec:
          contextSpaceRef: { kind: ContextSpace, name: "{{ space }}" }
          slug: "{{ endpointSlug }}"
          audience: public
          enabledRepresentations: [ngsi-ld, csv, ogc-features]
          catalog:
            publisher: { name: { en: "{{ publisher }}" } }
            contactPoint: { name: "{{ contactName }}", email: "{{ contactEmail }}" }
            license: {{ license | default('CC_BY_4_0') }}
            themes: [{{ theme | default('GOVE') }}]
            frequency: {{ frequency | default('DAILY') }}
          publish:
            ckan:
              instanceRef: { kind: CkanInstance, name: "{{ ckanInstance }}" }
              organization: "{{ ckanOrganization }}"
              name: "{{ name }}"
