# The platform's blueprint library (CC-28): a subscription that calls a notification channel when
# an observed value crosses a limit. An instance follows this folder through a SyncSource, and a
# new version arrives as a merge request in its repository (CC-26).
apiVersion: joinedcontext.com/v1alpha1
kind: Blueprint
metadata:
  name: threshold-alert
  namespace: org
  title: { en: "Threshold alert", fi: "Raja-arvohälytys", sk: "Upozornenie na prekročenie hodnoty", cs: "Upozornění na překročení hodnoty", de: "Grenzwertwarnung" }
  description:
    en: "Watches a property and notifies a channel when it crosses a limit."
    sk: "Sleduje vlastnosť a upozorní kanál, keď prekročí limit."
    cs: "Sleduje vlastnost a upozorní kanál, když překročí limit."
    de: "Beobachtet eine Eigenschaft und benachrichtigt einen Kanal, wenn sie einen Grenzwert überschreitet."
spec:
  version: 1.0.0
  category: alerting
  riskClass: green
  allowedRoles: [domain-editor, portal-approver]
  parameterSchema:
    type: object
    required: [name, space, entityType, observedProperty, thresholdValue, webhookUrl]
    additionalProperties: false
    properties:
      name: { type: string, title: "Alert name", x-jc-title: { sk: "Názov upozornenia", cs: "Název upozornění", de: "Name der Warnung" }, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "One word with hyphens; names the subscription.", x-jc-description: { sk: "Jedno slovo so spojovníkmi; pomenuje odber.", cs: "Jedno slovo se spojovníky; pojmenuje odběr.", de: "Ein Wort mit Bindestrichen; benennt das Abonnement." } }
      space: { type: string, title: "Context space", x-jc-title: { sk: "Kontextový priestor", cs: "Kontextový prostor", de: "Kontextbereich" }, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$", x-jc-widget: resourcePicker, x-jc-options: { plural: spaces } }
      entityType: { type: string, title: "Entity type watched", x-jc-title: { sk: "Sledovaný typ entity", cs: "Sledovaný typ entity", de: "Beobachteter Entitätstyp" }, pattern: "^[A-Z][A-Za-z0-9]+$", default: AirQualityObserved }
      observedProperty: { type: string, title: "Property watched", x-jc-title: { sk: "Sledovaná vlastnosť", cs: "Sledovaná vlastnost", de: "Beobachtete Eigenschaft" }, pattern: "^[a-zA-Z][A-Za-z0-9_]*$", default: airQualityIndex }
      comparison:
        type: string
        title: "Alert when the value is"
        x-jc-title: { sk: "Upozorniť, keď je hodnota", cs: "Upozornit, když je hodnota", de: "Warnen, wenn der Wert" }
        default: ">"
        oneOf:
          - { const: ">", title: "above the limit", x-jc-title: { sk: "nad limitom", cs: "nad limitem", de: "über dem Grenzwert liegt" } }
          - { const: ">=", title: "at or above the limit", x-jc-title: { sk: "na limite alebo nad ním", cs: "na limitu nebo nad ním", de: "am oder über dem Grenzwert liegt" } }
          - { const: "<", title: "below the limit", x-jc-title: { sk: "pod limitom", cs: "pod limitem", de: "unter dem Grenzwert liegt" } }
          - { const: "<=", title: "at or below the limit", x-jc-title: { sk: "na limite alebo pod ním", cs: "na limitu nebo pod ním", de: "am oder unter dem Grenzwert liegt" } }
      thresholdValue: { type: number, title: "Limit", x-jc-title: { sk: "Limit", cs: "Limit", de: "Grenzwert" } }
      webhookUrl: { type: string, title: "Notification channel (webhook URL)", x-jc-title: { sk: "Kanál pre upozornenia (URL webhooku)", cs: "Kanál pro upozornění (URL webhooku)", de: "Benachrichtigungskanal (Webhook-URL)" }, format: uri, pattern: "^https://[^\\s\"\\\\]+$" }
      webhookSecret:
        type: object
        title: "Token the channel expects"
        x-jc-title: { sk: "Token, ktorý kanál očakáva", cs: "Token, který kanál očekává", de: "Token, den der Kanal erwartet" }
        x-jc-widget: secretRef
        required: [name]
        additionalProperties: false
        properties:
          name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
          key: { type: string, pattern: "^[-._a-zA-Z0-9]{1,253}$" }
          envVar: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$" }
      throttling: { type: integer, title: "Seconds between two alerts", x-jc-title: { sk: "Sekundy medzi dvoma upozorneniami", cs: "Sekundy mezi dvěma upozorněními", de: "Sekunden zwischen zwei Warnungen" }, minimum: 0, maximum: 86400, default: 300 }
  # A parameter with a default is filled by the form; a caller of the API may leave it out, so
  # every template names the same default again.
  templates:
    - name: subscription
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: Subscription
        metadata:
          name: "{{ name }}"
          title: { en: "{{ entityType }} {{ observedProperty }} {{ comparison | default('>') }} {{ thresholdValue }}" }
        spec:
          contextSpaceRef: { kind: ContextSpace, name: "{{ space }}" }
          entities:
            - type: "{{ entityType }}"
          watchedAttributes: ["{{ observedProperty }}"]
          q: "{{ observedProperty }}{{ comparison | default('>') }}{{ thresholdValue }}"
          notification:
            endpoint:
              uri: "{{ webhookUrl }}"
              accept: application/json
        {%- if webhookSecret is defined %}
              secretRef: { name: "{{ webhookSecret.name }}", key: "{{ webhookSecret.key | default('token') }}" }
        {%- endif %}
            attributes: ["{{ observedProperty }}"]
            format: normalized
          throttling: {{ throttling | default(300) }}
          description: "Calls the channel when {{ observedProperty }} of a {{ entityType }} is {{ comparison | default('>') }} {{ thresholdValue }} (blueprint threshold-alert)."
