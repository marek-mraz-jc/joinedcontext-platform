# The platform's blueprint library (T-3838, MF-54, PL-76, ADR-N-048): a camera that publishes
# over MQTT, in one change. The MqttBroker lets the camera's ServiceAccount publish under its own
# client id, the camera signs in with a key pair whose private half never leaves it (PF-47), the
# DataSource reads the broker on its internal listener, and the Pipeline maps each message to a
# Smart Data Models Device and DeviceMeasurement written through the Endpoint and its Policy.
# More cameras are one ServiceAccount each, named in the broker's role: revoking one is removing
# its name.
# A message whose `observedAt` lies more than five minutes from the time it arrives, in the past
# or the future, or does not parse as a time, is dropped: a captured or backdated message cannot
# roll the Device back (T-5562). The Device's own times are the arrival time, so they only move
# forward; a frame replayed within the five minutes rewrites its DeviceMeasurement, keyed by the
# frame number, with the values it already holds.
apiVersion: joinedcontext.com/v1alpha1
kind: Blueprint
metadata:
  name: camera-over-mqtt
  namespace: org
  title: { en: "Camera over MQTT", fi: "Kamera MQTT:n kautta", sk: "Kamera cez MQTT", cs: "Kamera přes MQTT", de: "Kamera über MQTT" }
  description:
    en: "Connects a camera that signs in with its own key and sends its readings over MQTT."
    sk: "Pripojí kameru, ktorá sa prihlasuje vlastným kľúčom a posiela svoje údaje cez MQTT."
    cs: "Připojí kameru, která se přihlašuje vlastním klíčem a posílá svá data přes MQTT."
    de: "Bindet eine Kamera an, die sich mit eigenem Schlüssel anmeldet und ihre Messwerte über MQTT sendet."
spec:
  version: 1.1.0
  category: ingestion
  riskClass: yellow
  allowedRoles: [portal-approver]
  parameterSchema:
    type: object
    required: [name, space, camera, owner, keyId, keyX, keyY, endpointSlug]
    additionalProperties: false
    properties:
      name: { type: string, title: "Name", x-jc-title: { sk: "Názov", cs: "Název", de: "Name" }, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "One word with hyphens; names the broker, the DataSource, the Pipeline and the Endpoint.", x-jc-description: { sk: "Jedno slovo so spojovníkmi; pomenuje broker, zdroj údajov, pipelinu a Endpoint.", cs: "Jedno slovo se spojovníky; pojmenuje broker, zdroj dat, pipeline a Endpoint.", de: "Ein Wort mit Bindestrichen; benennt den Broker, die Datenquelle, die Pipeline und den Endpoint." } }
      space: { type: string, title: "Context space", x-jc-title: { sk: "Kontextový priestor", cs: "Kontextový prostor", de: "Kontextbereich" }, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$", x-jc-widget: resourcePicker, x-jc-options: { plural: spaces } }
      camera: { type: string, title: "Camera", x-jc-title: { sk: "Kamera", cs: "Kamera", de: "Kamera" }, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "The camera's ServiceAccount; it signs in as {project}-{camera}.", x-jc-description: { sk: "Servisný účet kamery; prihlasuje sa ako {project}-{camera}.", cs: "Servisní účet kamery; přihlašuje se jako {project}-{camera}.", de: "Das Dienstkonto der Kamera; es meldet sich als {project}-{camera} an." } }
      owner: { type: string, title: "Accountable person", x-jc-title: { sk: "Zodpovedná osoba", cs: "Odpovědná osoba", de: "Verantwortliche Person" }, pattern: "^[A-Za-z0-9._@-]{1,64}$", description: "The user who answers for the camera.", x-jc-description: { sk: "Používateľ, ktorý za kameru zodpovedá.", cs: "Uživatel, který za kameru odpovídá.", de: "Die Person, die für die Kamera verantwortlich ist." } }
      keyId: { type: string, title: "Key id", x-jc-title: { sk: "Identifikátor kľúča", cs: "Identifikátor klíče", de: "Schlüssel-ID" }, pattern: "^[A-Za-z0-9._-]{1,64}$", description: "The kid the camera names in its signed assertion.", x-jc-description: { sk: "Hodnota kid, ktorú kamera uvádza vo svojom podpísanom tvrdení.", cs: "Hodnota kid, kterou kamera uvádí ve svém podepsaném tvrzení.", de: "Die kid, die die Kamera in ihrer signierten Assertion nennt." } }
      keyX: { type: string, title: "Public key x", x-jc-title: { sk: "Verejný kľúč x", cs: "Veřejný klíč x", de: "Öffentlicher Schlüssel x" }, pattern: "^[A-Za-z0-9_-]{43}$", description: "The x coordinate of the camera's P-256 public key, base64url.", x-jc-description: { sk: "Súradnica x verejného kľúča P-256 kamery, base64url.", cs: "Souřadnice x veřejného klíče P-256 kamery, base64url.", de: "Die x-Koordinate des öffentlichen P-256-Schlüssels der Kamera, base64url." } }
      keyY: { type: string, title: "Public key y", x-jc-title: { sk: "Verejný kľúč y", cs: "Veřejný klíč y", de: "Öffentlicher Schlüssel y" }, pattern: "^[A-Za-z0-9_-]{43}$", description: "The y coordinate of the camera's P-256 public key, base64url.", x-jc-description: { sk: "Súradnica y verejného kľúča P-256 kamery, base64url.", cs: "Souřadnice y veřejného klíče P-256 kamery, base64url.", de: "Die y-Koordinate des öffentlichen P-256-Schlüssels der Kamera, base64url." } }
      endpointSlug: { type: string, title: "Endpoint slug", x-jc-title: { sk: "Slug endpointu", cs: "Slug endpointu", de: "Endpoint-Slug" }, pattern: "^[a-z2-7]{26,64}$", x-jc-widget: endpointSlug, description: "Minted by the platform; nobody types it.", x-jc-description: { sk: "Vytvorí ho platforma; nikto ho nepíše.", cs: "Vytvoří ho platforma; nikdo ho nepíše.", de: "Von der Plattform erzeugt; niemand tippt ihn ein." } }
  templates:
    - name: broker
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: MqttBroker
        metadata:
          name: "{{ name }}"
          title: { en: "Cameras of {{ name }}" }
        spec:
          roles:
            - name: cameras
              serviceAccounts: ["{{ camera }}"]
              publish: ["cameras/${clientid}/#"]
    - name: camera
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: ServiceAccount
        metadata:
          name: "{{ camera }}"
          title: { en: "Camera {{ camera }}" }
        spec:
          owner: { user: "{{ owner }}" }
          purpose: "Camera {{ camera }} publishes its observations to the MQTT broker {{ name }}"
          roles:
            - { role: space-reader, scope: { contextSpace: "{{ space }}" }, types: [Device] }
          credentials:
            - kind: oauth-client
              name: device-key
              jwks:
                keys:
                  - { kty: EC, crv: P-256, kid: "{{ keyId }}", x: "{{ keyX }}", y: "{{ keyY }}", alg: ES256, use: sig }
    - name: datasource
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: DataSource
        metadata:
          name: "{{ name }}"
          title: { en: "Camera messages of {{ name }}" }
        spec:
          type: mqtt
          mqtt:
            brokerRef: { kind: MqttBroker, name: "{{ name }}" }
            topics: ["cameras/+/#"]
            qos: 1
            cleanSession: true
    - name: pipeline
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: Pipeline
        metadata:
          name: "{{ name }}"
          title: { en: "Devices and measurements from {{ name }}" }
        spec:
          class: auto
          source:
            dataSourceRef: { kind: DataSource, name: "{{ name }}" }
          # The camera is the client id in the topic, which the broker's ACL binds to the camera's
          # verified token (ADR-N-048 §3), so a camera can only ever write its own Device. A message
          # timed more than PT5M from its arrival, or with a time that does not parse, is dropped
          # (T-5562); the Device takes the arrival time, so a replay never moves it back.
          compute:
            kind: bloblang
            bloblang: |
              let domain = env("JC_ORG_DOMAIN")
              let space = env("JC_SPACE")
              let camera = meta("mqtt_topic").split("/").index(1)
              let kind = this.measurementType.string()
              let received = now()
              let seen = this.observedAt.or($received).string()
              let skew = ($seen.ts_unix_milli() - $received.ts_unix_milli()).catch(null)
              let device = "urn:ngsi-ld:Device:%v:%v:%v".format($domain, $space, $camera)
              root = [
                {
                  "id": $device,
                  "type": "Device",
                  "category": { "type": "Property", "value": ["multimedia"] },
                  "controlledProperty": { "type": "Property", "value": [$kind] },
                  "deviceState": { "type": "Property", "value": "ok", "observedAt": $received },
                  "dateLastValueReported": { "type": "Property", "value": $received }
                },
                {
                  "id": "urn:ngsi-ld:DeviceMeasurement:%v:%v:%v-%v".format($domain, $space, $camera, this.frame.number()),
                  "type": "DeviceMeasurement",
                  "refDevice": { "type": "Relationship", "object": $device },
                  "controlledProperty": { "type": "Property", "value": $kind },
                  "numValue": { "type": "Property", "value": this.value.number(), "observedAt": $seen },
                  "dateObserved": { "type": "Property", "value": $seen }
                }
              ]
              root = if $skew == null || $skew > 300000 || $skew < -300000 { deleted() }
          targetEndpoint: "urn:ngsi-ld:Endpoint:{orgDomain}:{{ space }}:{{ name }}"
          quotas:
            maxMemoryMb: 64
            cpuMillicores: 100
    - name: endpoint
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: Endpoint
        metadata:
          name: "{{ name }}"
          title: { en: "Cameras of {{ name }}" }
        spec:
          contextSpaceRef: { kind: ContextSpace, name: "{{ space }}" }
          slug: "{{ endpointSlug }}"
          audience: organization
          enabledRepresentations: [ngsi-ld, csv]
